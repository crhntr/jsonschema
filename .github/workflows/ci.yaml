name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - name: Example issue tracker
        working-directory: examples/issues
        run: |
          go vet ./...
          go test -race ./...
      - name: Example pipeline editor
        working-directory: examples/concourse
        run: |
          go vet ./...
          go test -race ./...
